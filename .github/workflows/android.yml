name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-/nonexistent}" || { echo "::error::Android SDK missing on runner"; exit 1; }
          command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"; fi
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
          } > ~/.config/godot/editor_settings-4.7.tres
      - name: Verify Godot SDK settings
        run: |
          test -f "$HOME/.config/godot/editor_settings-4.7.tres"
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.7.tres"
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
      - name: Generate Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=GameForge AI,C=DE" -noprompt
          test -s "$HOME/.android/debug.keystore"
      - name: Configure CI debug signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path("export_presets.cfg")
          content = preset.read_text()
          for key, value in {
              'keystore/debug=""': 'keystore/debug="' + os.environ["HOME"] + '/.android/debug.keystore"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }.items():
              if key not in content:
                  raise SystemExit("Missing expected signing preset entry: " + key.split("=")[0])
              content = content.replace(key, value)
          preset.write_text(content)
          print("CI debug signing configured; keystore exists:", Path(os.environ["HOME"] + "/.android/debug.keystore").is_file())
          PY
      - name: Align Godot default debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          cp "$HOME/.android/debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          test -s "$HOME/.local/share/godot/keystores/debug.keystore"
          echo "Godot default debug keystore is present"
      - name: Import Godot project
        run: |
          godot --version
          godot --headless --path . --editor --import --quit
      - name: Check Android export configuration
        run: |
          test -f export_presets.cfg
          test -f game/main.tscn
          test -f game/main.gd
          ls -la ~/.config/godot || true
          ls -la ~/.local/share/godot/export_templates || true
          echo "Godot Android export templates:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -iname '*android*' -print || true
          echo "SDK package checks:"
          ls -ld "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" || true
          echo "Debug signing preset fields (password redacted):"
          grep -E '^keystore/debug(=|_user=)' export_presets.cfg || true
          echo "Debug keystore presence:"
          test -s "$HOME/.android/debug.keystore" && echo "Keystore exists" || echo "Keystore missing"
      - name: Diagnose Godot Android configuration
        shell: bash
        run: |
          echo "Android editor settings:"
          grep -nE 'android_sdk_path|java_sdk_path|debug_keystore|debug_keystore_user' "$HOME/.config/godot/editor_settings-4.7.tres" || true
          echo "Android SDK components:"
          for p in "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/35.0.0/apksigner" "$ANDROID_HOME/platforms/android-35/android.jar"; do
            test -f "$p" && echo "FOUND $p" || echo "MISSING $p"
          done
          echo "Android preset keys:"
          grep -E '^(name|platform|export_path|gradle_build/use_gradle_build|package/unique_name|keystore/debug|architectures/)' export_presets.cfg | sed -E 's/(password=).*/\1[REDACTED]/'
          echo "Template sizes:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/GameForgeAI.apk
          test -s build/GameForgeAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameForgeAI-debug-APK
          path: build/GameForgeAI.apk
          if-no-files-found: error
