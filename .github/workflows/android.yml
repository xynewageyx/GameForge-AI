name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "%s"
export/android/java_sdk_path = "%s"
' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Import and export
        run: |
          mkdir -p build
          godot --headless --path . --editor --import --quit
          godot --headless --path . --export-debug Android build/GameForgeAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameForgeAI-debug-APK
          path: build/GameForgeAI.apk
